name: Deploy CI3 to cPanel

on:
  push:
    branches:
      - BarrilDev

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      # (Opsional) Bisa tambahkan step untuk cek syntax PHP
      
      - name: Deploy to cPanel via FTP
        uses: SamKirkland/FTP-Deploy-Action@4.3.2
        with:
          server: advokat.japrime.id
          username: ${{ secrets.ftp_username }}
          password: ${{ secrets.ftp_password }}
          local-dir: ./
          server-dir: /public_html/advokat.japrime.id/
